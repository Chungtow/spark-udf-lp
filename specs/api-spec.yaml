# spark-udf-lp 函数接口契约（api-spec）

# 说明:
#   - UDF / UDAF / UDTF 非 HTTP 接口，本文件以 OpenAPI 风格 YAML 描述函数签名契约。
#   - 函数统一注册于 lpudf 库，任意库以 lpudf.<函数名> 全限定引用。
#   - 生命周期: 与当前分支开发周期绑定，新周期从空模板重新填充。
#   - 条目格式示例（复制后修改）:
#     <注册名>:
#       kind: UDF|UDAF|UDTF
#       status: released|planned
#       class: com.liangpu.<udf|udaf|udtf>.<ClassName>
#       description: <语义描述，含 null/空/边界行为>
#       parameters:
#         - name: <参数名>
#           type: string
#           required: true|false
#           description: <参数说明>
#       returns:
#         type: string|table
#         columns:              # type: table 时
#           - name: <列名>
#             type: string
#       examples:
#         - sql: "SELECT lpudf.<注册名>(...)"
#           result: "<期望输出>"
openapi: "3.0.3"
info:
  title: spark-udf-lp 函数契约
  version: 1.0.0
  description: >
    Spark 自定义函数库（UDF/UDAF/UDTF）的接口契约。
    构建产物发布至 HDFS /udf/，函数注册于 lpudf 库（唯一注册地址）。
    2026-08-27（迭代 4）：恢复迭代 1~3 的 12 个基线函数条目 + 新增字符串处理 10 个（released，UAT 通过）。

functions:
  # ---- 迭代 1 基线（3 个，released）----
  udf_prefix:
    kind: UDF
    status: released
    class: com.liangpu.udf.PrefixUdf
    description: 返回字符串前 4 个字符（示例 UDF）；str 为 NULL 时返回 NULL。
    parameters:
      - name: str
        type: string
        required: true
        description: 字符串表达式
    returns:
      type: string
    examples:
      - sql: "SELECT lpudf.udf_prefix('abcdef')"
        result: "abcd"
  udaf_string_agg:
    kind: UDAF
    status: released
    class: com.liangpu.udaf.StringAggUDAF
    description: 字符串列聚合去重拼接：按字典序排序、逗号分隔输出，NULL 行忽略。
    parameters:
      - name: col
        type: string
        required: true
        description: 待聚合的字符串列
    returns:
      type: string
    examples:
      - sql: "SELECT lpudf.udaf_string_agg(col) FROM (SELECT array('b','a','c') AS col) t"
        result: "a,b,c"
  udtf_split_rows:
    kind: UDTF
    status: released
    class: com.liangpu.udtf.SplitRowsUDTF
    description: 字符串按分隔符拆分为多行（单列输出）；NULL/空串无输出，分隔符 NULL/空时默认逗号。
    parameters:
      - name: str
        type: string
        required: true
        description: 待拆分的字符串
      - name: delim
        type: string
        required: false
        description: 分隔符（字面量匹配），默认逗号
    returns:
      type: table
      columns:
        - name: col
          type: string
    examples:
      - sql: "SELECT lpudf.udtf_split_rows('a,b,c') AS col"
        result: "a / b / c（3 行）"

  # ---- 迭代 2 基线（9 个 JSON 函数，released）----
  json_valid:
    kind: UDF
    status: released
    class: com.liangpu.udf.JsonValidUdf
    description: 校验输入字符串是否为合法 JSON（RFC 8259），合法返回 true，非法返回 false；SQL NULL 入参返回 NULL。
    parameters:
      - name: json
        type: string
        required: true
        description: 待校验的 JSON 文本
    returns:
      type: boolean
    examples:
      - sql: "SELECT lpudf.json_valid('{\"a\":1}')"
        result: "true"
  json_extract:
    kind: UDF
    status: released
    class: com.liangpu.udf.JsonExtractUdf
    description: 按 JSONPath 提取值并返回 JSON 文本；path 支持 $.key / $[n] / $['key'] 子集，目标不存在返回 NULL，path 语法非法抛错，非法 JSON 返回 NULL。
    parameters:
      - name: json
        type: string
        required: true
        description: JSON 文本
      - name: path
        type: string
        required: true
        description: JSONPath 表达式，如 '$.a'、'$.a[0]'
    returns:
      type: string
    examples:
      - sql: "SELECT lpudf.json_extract('{\"a\":{\"b\":1}}', '$.a.b')"
        result: "1"
  json_length:
    kind: UDF
    status: released
    class: com.liangpu.udf.JsonLengthUdf
    description: 返回 JSON 数据长度：数组为元素数、对象为成员数、其它类型为 1，不递归计算；未指定 path 时作用于整个 JSON。
    parameters:
      - name: json
        type: string
        required: true
        description: JSON 文本
      - name: path
        type: string
        required: false
        description: JSONPath 表达式（可选）
    returns:
      type: integer
    examples:
      - sql: "SELECT lpudf.json_length('[1,2,3]')"
        result: "3"
  json_type:
    kind: UDF
    status: released
    class: com.liangpu.udf.JsonTypeUdf
    description: 返回 JSON 数据类型名称（小写）：string / number / boolean / null / object / array。
    parameters:
      - name: json
        type: string
        required: true
        description: JSON 文本
    returns:
      type: string
    examples:
      - sql: "SELECT lpudf.json_type('{\"a\":1}')"
        result: "object"
  json_exists:
    kind: UDF
    status: released
    class: com.liangpu.udf.JsonExistsUdf
    description: 判断 JSONPath 对应值是否存在，存在返回 true（含值为 null 的键），不存在或数组越界返回 false。
    parameters:
      - name: json
        type: string
        required: true
        description: JSON 文本
      - name: path
        type: string
        required: true
        description: JSONPath 表达式
    returns:
      type: boolean
    examples:
      - sql: "SELECT lpudf.json_exists('{\"a\":null}', '$.a')"
        result: "true"
  json_contains:
    kind: UDF
    status: released
    class: com.liangpu.udf.JsonContainsUdf
    description: 判断 JSON 数据是否包含与 candidate 深度相等的节点（覆盖数组元素/对象值匹配），包含返回 true；path 不存在或语法非法返回 false。
    parameters:
      - name: json
        type: string
        required: true
        description: 待检查的 JSON 文本
      - name: candidate
        type: string
        required: true
        description: 要匹配的 JSON 元素文本，如 '4'、'\"abc\"'、'{\"a\":1}'
      - name: path
        type: string
        required: false
        description: JSONPath 表达式（可选）
    returns:
      type: boolean
    examples:
      - sql: "SELECT lpudf.json_contains('[1,2,3]', '2')"
        result: "true"
  json_pretty:
    kind: UDF
    status: released
    class: com.liangpu.udf.JsonPrettyUdf
    description: 美化 JSON：增加换行与缩进（每层 4 空格缩进、键值冒号后无空格）。
    parameters:
      - name: json
        type: string
        required: true
        description: JSON 文本
    returns:
      type: string
    examples:
      - sql: "SELECT lpudf.json_pretty('{\"a\":1}')"
        result: "{\n    \"a\": 1\n}"
  json_strip_nulls:
    kind: UDF
    status: released
    class: com.liangpu.udf.JsonStripNullsUdf
    description: 递归移除值为 null 的字段/元素；include_arrays 默认 true，remove_empty 默认 false，path 仅限第 4 参。
    parameters:
      - name: json
        type: string
        required: true
        description: JSON 文本（对象或数组）
      - name: include_arrays
        type: boolean
        required: false
        description: 是否删除数组内 null（可选，默认 true）
      - name: remove_empty
        type: boolean
        required: false
        description: 删除后是否移除空对象/空数组（可选，默认 false）
      - name: path
        type: string
        required: false
        description: JSONPath，仅处理该路径下的 null（必须作为第 4 参）
    returns:
      type: string
    examples:
      - sql: "SELECT lpudf.json_strip_nulls('{\"a\":1,\"b\":null}')"
        result: "{\"a\":1}"
  json_explode:
    kind: UDTF
    status: released
    class: com.liangpu.udtf.JsonExplodeUDTF
    description: 将 JSON 数组/对象展开为多行（固定输出两列 key, value）：数组每元素一行 key 为 NULL，对象每键一行；NULL/非法 JSON/非数组对象输出 0 行。
    parameters:
      - name: json
        type: string
        required: true
        description: JSON 数组或对象文本
    returns:
      type: table
      columns:
        - name: key
          type: string
        - name: value
          type: string
    examples:
      - sql: "SELECT lpudf.json_explode('{\"a\":1,\"b\":2}') AS (k, v)"
        result: "a,1 / b,2（2 行）"

  # ---- 迭代 4 新增：字符串处理函数（10 个，released）----
  keyvalue:
    kind: UDF
    status: released
    class: com.liangpu.udf.KeyvalueUdf
    description: 从半结构化 kv 串中提取指定 key 的值；2 参形式用默认分隔符（& 分隔键值对、= 分隔 key/value），4 参形式自定义 split1/split2；key 不存在返回 NULL。
    parameters:
      - name: str
        type: string
        required: true
        description: 半结构化字符串，如 'k1=v1&k2=v2'
      - name: key
        type: string
        required: true
        description: 要提取的 key 名（2 参形式第 2 参）
      - name: split1
        type: string
        required: false
        description: 键值对分隔符（4 参形式，默认 &）
      - name: split2
        type: string
        required: false
        description: key/value 分隔符（4 参形式，默认 =）
    returns:
      type: string
    examples:
      - sql: "SELECT lpudf.keyvalue('k1=v1&k2=v2', 'k2')"
        result: "v2"
      - sql: "SELECT lpudf.keyvalue('k1:v1;k2:v2', ';', ':', 'k2')"
        result: "v2"
  keyvalue_tuple:
    kind: UDTF
    status: released
    class: com.liangpu.udtf.KeyvalueTupleUDTF
    description: 半结构化 kv 串多键一次提取（UDTF）：每 key 一列输出，列序与参数一致，找不到的 key 为 NULL；str 为 NULL 或非 kv 结构输出 0 行。
    parameters:
      - name: str
        type: string
        required: true
        description: 半结构化字符串，如 'k1=v1&k2=v2'
      - name: split1
        type: string
        required: true
        description: 键值对分隔符，如 '&'
      - name: split2
        type: string
        required: true
        description: key/value 分隔符，如 '='
      - name: key1..keyN
        type: string
        required: true
        description: 至少 1 个 key（可变参数，第 4 参起），输出一列对应一个 key
    returns:
      type: table
      columns:
        - name: key1..keyN
          type: string
    examples:
      - sql: "SELECT lpudf.keyvalue_tuple('k1=v1&k2=v2', '&', '=', 'k1', 'k2') AS (k1, k2)"
        result: "v1,v2（1 行 2 列）"
  url_encode:
    kind: UDF
    status: released
    class: com.liangpu.udf.UrlEncodeUdf
    description: URL 百分号编码（application/x-www-form-urlencoded）：空格→+、-_. 保留、* 不编码、~→%7E、非 ASCII 按 UTF-8 字节编码；NULL 返回 NULL。
    parameters:
      - name: str
        type: string
        required: true
        description: 待编码字符串
    returns:
      type: string
    examples:
      - sql: "SELECT lpudf.url_encode('a b')"
        result: "a+b"
      - sql: "SELECT lpudf.url_encode('中')"
        result: "%E4%B8%AD"
  url_decode:
    kind: UDF
    status: released
    class: com.liangpu.udf.UrlDecodeUdf
    description: URL 百分号解码（url_encode 逆操作）：+→空格、%XX 按 UTF-8 还原；非法百分号序列（数据问题）返回 NULL；NULL 返回 NULL。
    parameters:
      - name: str
        type: string
        required: true
        description: 待解码字符串
    returns:
      type: string
    examples:
      - sql: "SELECT lpudf.url_decode('a+b')"
        result: "a b"
      - sql: "SELECT lpudf.url_decode('%E4%B8%AD')"
        result: "中"
  mask_hash:
    kind: UDF
    status: released
    class: com.liangpu.udf.MaskHashUdf
    description: 脱敏哈希：对字符串做不可逆哈希，输出固定 64 字符小写十六进制（SHA-256）；NULL 或非字符串类型入参返回 NULL（算法与 MC 不要求结果一致）。
    parameters:
      - name: str
        type: string
        required: true
        description: 待脱敏字符串
    returns:
      type: string
    examples:
      - sql: "SELECT lpudf.mask_hash('abc')"
        result: "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
  regexp_count:
    kind: UDF
    status: released
    class: com.liangpu.udf.RegexpCountUdf
    description: 统计正则匹配次数；可选起始位置 fromPos（1-based）；无匹配返回 0，fromPos 越界不抛错返回 0；NULL 入参返回 NULL。
    parameters:
      - name: str
        type: string
        required: true
        description: 源字符串
      - name: pattern
        type: string
        required: true
        description: 正则表达式（Java Pattern 语法）
      - name: fromPos
        type: integer
        required: false
        description: 起始匹配位置（1-based，默认 1）
    returns:
      type: integer
    examples:
      - sql: "SELECT lpudf.regexp_count('a1b2c3', '[0-9]')"
        result: "3"
      - sql: "SELECT lpudf.regexp_count('a1b2c3', '[0-9]', 3)"
        result: "2"
  regexp_extract_all:
    kind: UDF
    status: released
    class: com.liangpu.udf.RegexpExtractAllUdf
    description: 正则全量提取：返回所有匹配子串的 array<string>；可选 group 指定提取组（默认 0 全匹配）；无匹配返回空数组；NULL 入参返回 NULL。
    parameters:
      - name: str
        type: string
        required: true
        description: 源字符串
      - name: pattern
        type: string
        required: true
        description: 正则表达式（Java Pattern 语法）
      - name: group
        type: integer
        required: false
        description: 捕获组索引（默认 0，全匹配）
    returns:
      type: array<string>
    examples:
      - sql: "SELECT lpudf.regexp_extract_all('a1b2c3', '[0-9]')"
        result: "[\"1\",\"2\",\"3\"]"
  regexp_substr:
    kind: UDF
    status: released
    class: com.liangpu.udf.RegexpSubstrUdf
    description: 返回正则匹配的子串；可选起始位置 fromPos（1-based）与出现次数 occurrence；无匹配返回 NULL；NULL 入参返回 NULL。
    parameters:
      - name: str
        type: string
        required: true
        description: 源字符串
      - name: pattern
        type: string
        required: true
        description: 正则表达式（Java Pattern 语法）
      - name: fromPos
        type: integer
        required: false
        description: 起始匹配位置（1-based，默认 1）
      - name: occurrence
        type: integer
        required: false
        description: 第几次出现（默认 1）
    returns:
      type: string
    examples:
      - sql: "SELECT lpudf.regexp_substr('abc123def456', '[0-9]+')"
        result: "123"
      - sql: "SELECT lpudf.regexp_substr('abc123def456', '[0-9]+', 1, 2)"
        result: "456"
  regexp_replace_nth:
    kind: UDF
    status: released
    class: com.liangpu.udf.RegexpReplaceNthUdf
    description: 只替换第 nth 次正则匹配（MC regexp_replace occurrence 增强，换名避免与内置冲突）；repl 支持 \\1 后向引用；超出匹配次数原样返回；NULL 入参返回 NULL。
    parameters:
      - name: str
        type: string
        required: true
        description: 源字符串
      - name: pattern
        type: string
        required: true
        description: 正则表达式（Java Pattern 语法）
      - name: repl
        type: string
        required: true
        description: 替换串，支持 \\1 后向引用（原样传入 appendReplacement）
      - name: occurrence
        type: integer
        required: false
        description: 只替换第几次匹配（默认 1）
    returns:
      type: string
    examples:
      - sql: "SELECT lpudf.regexp_replace_nth('abc123def456', '[0-9]+', 'X')"
        result: "abcXdef456"
      - sql: "SELECT lpudf.regexp_replace_nth('abc123def456', '[0-9]+', 'X', 2)"
        result: "abc123defX"
  find_in_set_ex:
    kind: UDF
    status: released
    class: com.liangpu.udf.FindInSetExUdf
    description: 返回 str 在 str_list（分隔符列表）中的位置（1-based）；找不到返回 0；支持第 3 参自定义分隔符（默认逗号，与内置 find_in_set 一致）；str 或 str_list 为 NULL 返回 0。
    parameters:
      - name: str
        type: string
        required: true
        description: 要查找的字符串
      - name: str_list
        type: string
        required: true
        description: 由分隔符连接的元素列表，如 'a,b,c'
      - name: delimiter
        type: string
        required: false
        description: 自定义分隔符（默认逗号）
    returns:
      type: integer
    examples:
      - sql: "SELECT lpudf.find_in_set_ex('b', 'a,b,c')"
        result: "2"
      - sql: "SELECT lpudf.find_in_set_ex('b', 'a;b;c', ';')"
        result: "2"
